<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Mestre - Armagedon</title>
    <style>
        body { background-color: #050505; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        h1 { color: #ff9900; font-family: cursive; font-size: 3rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 100%; max-width: 800px; }
        .card { background: #111; border: 1px solid #333; padding: 20px; border-radius: 8px; text-align: center; text-decoration: none; color: #fff; transition: 0.2s; }
        .card:hover { border-color: #ff9900; transform: translateY(-5px); background: #1a1a1a; }
        .card h3 { margin: 0; font-size: 1.5rem; }
        .card span { color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Painel do Mestre</h1>
    <div class="grid">
        <a href="/?char=Drakon" target="_blank" class="card">
            <h3>Drakon</h3>
            <span>Dracomante</span>
        </a>
        
        <a href="/?char=Theodor" target="_blank" class="card">
            <h3>Theodor</h3>
            <span>Muralha</span>
        </a>

        </div>
</body>
</html>
